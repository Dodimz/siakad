# CONTOH — jangan commit file asli berisi password.
# Cara pakai:
#   1. cp k8s/21-app-secret.example.yaml k8s/21-app-secret.yaml
#   2. Isi APP_KEY (hasil `php artisan key:generate --show`) dan DB_PASSWORD acak.
#   3. kubectl apply -f k8s/21-app-secret.yaml
# File k8s/21-app-secret.yaml sudah masuk .dockerignore + .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: siakad-app
  namespace: siakad
type: Opaque
stringData:
  APP_KEY: base64:PASTE_HASIL_KEY_GENERATE_DI_SINI
  DB_PASSWORD: PASTE_PASSWORD_ACAK_MIN_16_KARAKTER
  GEMINI_API_KEY: ""
