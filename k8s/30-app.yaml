apiVersion: apps/v1
kind: Deployment
metadata:
  name: siakad
  namespace: siakad
spec:
  # 1 replica karena storage upload memakai PVC ReadWriteOnce.
  replicas: 1
  selector:
    matchLabels:
      app: siakad
  template:
    metadata:
      labels:
        app: siakad
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        fsGroup: 33
      containers:
        - name: siakad
          image: ghcr.io/dodimz/siakad:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: siakad-app
            - secretRef:
                name: siakad-app
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage/app
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: siakad-storage
