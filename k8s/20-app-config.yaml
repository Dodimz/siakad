apiVersion: v1
kind: ConfigMap
metadata:
  name: siakad-app
  namespace: siakad
data:
  APP_NAME: SIAKAD
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://eduvers.my.id
  LOG_CHANNEL: stack
  LOG_LEVEL: error
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: siakad
  DB_USERNAME: siakad
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  RUN_MIGRATIONS: "false"
